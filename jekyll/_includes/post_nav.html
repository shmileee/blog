{% if page.previous.url or page.next.url %}
  <nav class="post-navigation" aria-label="Adjacent notes">
    <p class="section-eyebrow">Next in the archive</p>
    <div class="post-navigation-grid">
      {% if page.previous.url %}
        <a href="{{ page.previous.url | relative_url }}">
          <span class="post-navigation-kicker">← Older</span>
          <strong>{{ page.previous.title }}</strong>
        </a>
      {% endif %}
      {% if page.next.url %}
        <a class="post-navigation-next" href="{{ page.next.url | relative_url }}">
          <span class="post-navigation-kicker">Newer →</span>
          <strong>{{ page.next.title }}</strong>
        </a>
      {% endif %}
    </div>
  </nav>
{% endif %}
