<section class="comments-region" aria-labelledby="comments-title">
  <h2 id="comments-title">Comments</h2>
  <div id="comments"></div>
</section>
<script>
  function loadGiscusComments() {
      var script = document.createElement('script');
      script.src = "https://giscus.app/client.js";
      script.async = true;
      script.crossOrigin = "anonymous";

      script.setAttribute("data-repo", "shmileee/blog");
      script.setAttribute("data-repo-id", "R_kgDONajVjQ");
      script.setAttribute("data-category", "Comments");
      script.setAttribute("data-category-id", "DIC_kwDONajVjc4ClC6H");
      script.setAttribute("data-mapping", "pathname");
      script.setAttribute("data-strict", "1");
      script.setAttribute("data-reactions-enabled", "0");
      script.setAttribute("data-emit-metadata", "0");
      script.setAttribute("data-input-position", "top");
      script.setAttribute("data-theme", document.documentElement.dataset.theme === "light" ? "light" : "transparent_dark");
      script.setAttribute("data-lang", "en");
      script.setAttribute("data-loading", "lazy");

      document.getElementById("comments").appendChild(script);
  }

  var scriptLoaded = false;
  function loadCommentScriptOnce() {
    if (!scriptLoaded) {
      loadGiscusComments();
      scriptLoaded = true;
    }
  }

  setTimeout(loadCommentScriptOnce, 5000);
  window.addEventListener("scroll", loadCommentScriptOnce, { once: true, passive: true });
  window.addEventListener("om-theme-change", function(event) {
    var frame = document.querySelector("iframe.giscus-frame");
    if (!frame) return;
    frame.contentWindow.postMessage({
      giscus: {
        setConfig: {
          theme: event.detail === "light" ? "light" : "transparent_dark"
        }
      }
    }, "https://giscus.app");
  });
</script>
