---
layout: default
---

<main id="main-content" class="page-shell">
  <article class="post-detail">
    <header class="detail-header post-header">
      <a class="back-link" href="/">← all notes</a>
      <p class="section-eyebrow"><time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: "%d %B %Y" }}</time></p>
      <h1>{{ page.title }}</h1>
      {% if page.categories %}
        <ul class="topic-list post-topics" aria-label="Topics">
          {% for category in page.categories %}
            <li><a href="{{ '/categories/' | append: category | append: '/' | relative_url }}">{{ category }}</a></li>
          {% endfor %}
        </ul>
      {% endif %}
    </header>

    <div class="prose">
      {{ content }}
    </div>

    {% include post_nav.html %}
    {% include comments.html %}
  </article>
</main>
